user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Compress text assets: the Tailwind bundle alone drops from ~55 kB to ~12 kB,
    # which is the single biggest win for first paint on mobile connections.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    server {
        listen ${PORT} default_server;
        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        # Uploaded CVs are submitted as links, so requests stay small; this only
        # guards against oversized POST bodies.
        client_max_body_size 20m;

        # Baseline hardening. A CSP is deliberately omitted: it needs to be tuned
        # against the inline Blade scripts before it can be enforced safely.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Vite fingerprints these filenames, so they can be cached indefinitely.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.ht { deny all; }
    }
}
